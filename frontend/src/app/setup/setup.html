<div class="login-wrapper">

  <div class="login-box">

    <h1>Configuración inicial</h1>
    <p>Crea la cuenta de administrador para empezar a usar el sistema</p>

    @if (error) {
      <p class="login-error">{{ error }}</p>
    }

    <form (ngSubmit)="crearAdmin()">

      <label>Correo del administrador</label>
      <input type="email" [(ngModel)]="correo" name="correo" required>

      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" required>

      <label>Confirmar contraseña</label>
      <input type="password" [(ngModel)]="confirmarPassword" name="confirmarPassword" required>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Creando...' : 'Crear cuenta y continuar' }}
      </button>

    </form>

  </div>

</div>
