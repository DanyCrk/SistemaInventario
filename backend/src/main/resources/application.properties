spring.application.name=SistemaInventario


spring.datasource.url=jdbc:sqlite:D:/SistemaInventario/database/inventario.db
spring.datasource.driver-class-name=org.sqlite.JDBC


spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON;
app.database.path=D:/SistemaInventario/database/inventario.db
app.backup.path=D:/SistemaInventario/database/backups


server.port=8080